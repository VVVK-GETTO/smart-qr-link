<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #25bcb4; --primary-dark: #1ea39c; --ink: #111417; --ink-2: #4b5563; --ink-3: #8a94a6; --line: #e6e9ee; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #fff; color: var(--ink);
      display: flex; align-items: center; justify-content: center; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .stage { width: 100%; max-width: 360px; text-align: center; }
    .stage[hidden] { display: none; }

    /* Loader: pulsing ring + orbiting dot */
    .loader { position: relative; width: 108px; height: 108px; margin: 0 auto 28px; }
    .loader .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 4px solid rgba(37, 188, 180, .18);
    }
    .loader .arc {
      position: absolute; inset: 0; border-radius: 50%;
      border: 4px solid transparent; border-top-color: var(--primary); border-right-color: var(--primary);
      animation: spin 1s cubic-bezier(.5, .15, .35, .85) infinite;
    }
    .loader .pulse {
      position: absolute; inset: 0; border-radius: 50%;
      background: var(--primary); opacity: .18;
      animation: pulse 1.6s ease-out infinite;
    }
    .loader .core {
      position: absolute; inset: 30px; border-radius: 50%; background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(37, 188, 180, .4);
    }
    .loader .core svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0% { transform: scale(.75); opacity: .3; } 100% { transform: scale(1.35); opacity: 0; } }

    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
    p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.5; }
    .dots::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

    .progress { height: 4px; border-radius: 999px; background: #eef1f4; overflow: hidden; margin: 24px auto 0; max-width: 220px; }
    .progress i { display: block; height: 100%; width: 40%; border-radius: 999px; background: var(--primary); animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }

    .icon-wrap { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px; background: #f5f7f8; display: flex; align-items: center; justify-content: center; }
    .icon-wrap svg { width: 28px; height: 28px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .stores { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
    .store-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 13px 16px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 15px;
      transition: transform .06s, background .15s;
    }
    .store-btn:active { transform: translateY(1px); }
    .store-btn.primary { background: var(--primary); color: #fff; }
    .store-btn.primary:hover { background: var(--primary-dark); }
    .store-btn.dark { background: var(--ink); color: #fff; }
    .store-btn.dark:hover { background: #000; }
    .store-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .link-fallback { margin-top: 16px; font-size: 13px; }
    .link-fallback a { color: var(--primary-dark); font-weight: 600; word-break: break-all; }
    .footer { margin-top: 40px; font-size: 12px; color: var(--ink-3); }
  </style>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-database-compat.js"></script>
</head>
<body>
  <!-- Loading -->
  <section class="stage" id="loading">
    <div class="loader">
      <span class="pulse"></span>
      <span class="ring"></span>
      <span class="arc"></span>
      <span class="core"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
    </div>
    <h1>Taking you there<span class="dots"></span></h1>
    <p id="loadingText">Finding the right destination for your device</p>
    <div class="progress"><i></i></div>
  </section>

  <!-- Store chooser (desktop / unknown device) -->
  <section class="stage" id="choose" hidden>
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="10" y1="18" x2="14" y2="18"/></svg></div>
    <h1 id="chooseTitle">Get the app</h1>
    <p>Open this on your phone, or pick your store below.</p>
    <div class="stores">
      <a class="store-btn primary" id="iosBtn" href="#">
        <svg viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1.9-4 2.4-1.7 3-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.6-1-2.6-3.8zM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.9-1 2.9 1.1.1 2.2-.5 2.8-1.4z"/></svg>
        App Store
      </a>
      <a class="store-btn dark" id="androidBtn" href="#">
        <svg viewBox="0 0 24 24"><path d="M3.6 2.3c-.3.2-.5.6-.5 1.1v17.2c0 .5.2.9.5 1.1l9.6-9.7-9.6-9.7zm10.9 11l-2.6-2.6-8.7 8.7 10.2-5.8 1.1-.3zm3.6-3.6l-2.6-1.5-2.9 2.9 2.9 2.9 2.6-1.5c.8-.5.8-2.3 0-2.8zm-13-7.4l8.7 8.7 2.6-2.6-11.3-6.1z"/></svg>
        Google Play
      </a>
    </div>
    <div class="footer">Powered by Smart Link</div>
  </section>

  <!-- Error -->
  <section class="stage" id="error" hidden>
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div>
    <h1 id="errorTitle">Link not found</h1>
    <p id="errorText">This link may have been deleted or the QR code is out of date.</p>
    <div class="footer">Powered by Smart Link</div>
  </section>

  <script src="firebase-config.js"></script>
  <script src="redirect.js"></script>
</body>
</html>
